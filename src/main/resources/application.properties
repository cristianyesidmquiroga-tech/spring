spring.application.name=porteria-api
server.port=${SERVER_PORT:31026}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:porteria_spring}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

spring.jackson.time-zone=America/Bogota
# Campos que no estén en el contrato de la API se rechazan con 400
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.data.web.pageable.max-page-size=50
# Detrás del proxy de Coolify: Tomcat toma la IP real de X-Forwarded-For solo si viene de una red interna
server.forward-headers-strategy=native
server.max-http-request-header-size=16KB
server.tomcat.max-http-form-post-size=64KB
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=8MB

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

management.endpoints.web.exposure.include=health

jwt.secret=${JWT_SECRET}

app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
app.admin.documento=${ADMIN_DOCUMENTO:}
app.fotos.carpeta=${CARPETA_FOTOS:datos/fotos}

app.carnet.perfiles=${CARNET_PERFILES:}
app.carnet.regional=${CARNET_REGIONAL:Regional Santander}
app.carnet.centro=${CARNET_CENTRO:Centro de Gesti\u00f3n Agroempresarial del Oriente}
app.carnet.aseguradora=${CARNET_ASEGURADORA:Aseguradora Aurora}
app.carnet.aseguradora-tel=${CARNET_ASEGURADORA_TEL:601-7443718 Op. 1}
app.carnet.poliza=${CARNET_POLIZA:100603}
