name: Pruebas

on:
  push:
  pull_request:

jobs:
  junit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Testcontainers levanta PostgreSQL 16 con el Docker que ya trae el runner
      - run: ./mvnw -B verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reportes-pruebas
          path: |
            target/surefire-reports/
            target/site/jacoco/
